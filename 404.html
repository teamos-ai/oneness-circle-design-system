<style>
:root{
  --ivory:#f9f9f7;
  --paper:#f4f1ea;
  --gold:#B8965A;
  --gold-soft:rgba(184,150,90,.18);
  --violet:#1E0A2E;
  --ink:#3D2E1A;
  --ink-muted:#6B5A40;
  --soul:'Cormorant Garamond', Georgia, serif;
  --mind:'Jost', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--mind);
  font-weight:300;
  color:var(--ink);
  background:var(--ivory);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:48px 24px;
  -webkit-font-smoothing:antialiased;
}
.frame{
  max-width:560px; width:100%;
  text-align:center;
  display:flex; flex-direction:column; gap:32px;
  align-items:center;
}
.mark{color:var(--gold);}
.kicker{
  font-family:var(--mono);
  font-size:10px; letter-spacing:.42em; text-transform:uppercase;
  color:var(--gold);
  font-weight:500;
  display:inline-flex; align-items:center; gap:14px;
}
.kicker::before,.kicker::after{
  content:""; width:28px; height:1px; background:var(--gold-soft);
}
h1{
  font-family:var(--soul);
  font-weight:300;
  font-size:clamp(48px, 9vw, 92px);
  line-height:.96;
  letter-spacing:-.02em;
  color:var(--violet);
  text-wrap:balance;
}
h1 em{font-style:italic; color:var(--gold); font-weight:300;}
p{
  font-family:var(--soul);
  font-style:italic;
  font-size:clamp(17px, 2vw, 21px);
  line-height:1.45;
  color:var(--ink-muted);
  max-width:42ch;
  text-wrap:pretty;
}
.divider{
  width:48px; height:.5px;
  background:var(--gold-soft);
  margin:8px 0;
}
.back{
  display:inline-flex; align-items:center; gap:10px;
  padding:14px 28px;
  background:var(--violet);
  color:var(--ivory);
  text-decoration:none;
  font-family:var(--mind);
  font-size:13px;
  font-weight:500;
  letter-spacing:.06em;
  text-transform:uppercase;
  border:none;
  transition:transform .24s cubic-bezier(.22,.61,.36,1);
}
.back:hover{transform:translateY(-1px);}
.back .arr{transition:transform .24s cubic-bezier(.22,.61,.36,1);}
.back:hover .arr{transform:translateX(3px);}
.foot{
  font-family:var(--mono);
  font-size:9px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--ink-muted);
  opacity:.62;
  margin-top:16px;
}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
</style>
</head>
<body>
<main class="frame">
  <svg class="mark" width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
      <line x1="50" y1="33" x2="50" y2="9"/><line x1="50" y1="67" x2="50" y2="91"/>
      <line x1="33" y1="50" x2="9" y2="50"/><line x1="67" y1="50" x2="91" y2="50"/>
      <line x1="60" y1="40" x2="79" y2="21"/><line x1="40" y1="60" x2="21" y2="79"/>
      <line x1="60" y1="60" x2="79" y2="79"/><line x1="40" y1="40" x2="21" y2="21"/>
    </g>
    <circle cx="50" cy="50" r="12" stroke="currentColor" stroke-width="1.6" fill="none"/>
    <circle cx="50" cy="50" r="4.5" fill="currentColor"/>
  </svg>
  <span class="kicker">Plate not found · 404</span>
  <h1>The page has <em>wandered.</em></h1>
  <div class="divider" role="presentation"></div>
  <p>What you were looking for is not at this address. Return to the system and find your bearing.</p>
  <a class="back" href="/">Return to the circle <span class="arr">→</span></a>
  <div class="foot">The Oneness Circle · Design System</div>
</main>
</body>
</html>
